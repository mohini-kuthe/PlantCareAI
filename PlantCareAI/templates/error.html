{% extends "base.html" %}

{% block title %}{{ code }} — PlantCareAI{% endblock %}

{% block body %}
<div class="min-h-screen bg-background flex items-center justify-center relative overflow-hidden px-4">

    <!-- Ambient background glow -->
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-1/3 left-1/3 w-96 h-96 bg-error/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/3 right-1/3 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
    </div>

    <div class="relative text-center animate-fade-in-up">
        <!-- Error Code -->
        <div class="relative mb-8">
            <span class="text-[10rem] md:text-[14rem] font-black text-surface-container-high leading-none select-none">{{ code }}</span>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-24 h-24 bg-surface-container rounded-full flex items-center justify-center border border-outline-variant">
                    <span class="material-symbols-outlined text-5xl text-error" style="font-variation-settings: 'FILL' 1;">
                        {{ 'search_off' if code == 404 else 'error' }}
                    </span>
                </div>
            </div>
        </div>

        <h1 class="text-2xl md:text-3xl font-black tracking-tighter text-on-background mb-3">{{ message }}</h1>
        <p class="text-secondary-fixed mb-8 max-w-md mx-auto">{{ detail }}</p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/dashboard" class="px-6 py-3 bg-primary text-on-primary font-bold rounded-lg hover:brightness-110 transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">home</span>
                Go to Dashboard
            </a>
            <a href="javascript:history.back()" class="px-6 py-3 border border-outline-variant text-secondary-fixed hover:text-on-surface rounded-lg transition-all flex items-center justify-center gap-2 font-semibold">
                <span class="material-symbols-outlined">arrow_back</span>
                Go Back
            </a>
        </div>

        <p class="text-[10px] text-outline mt-12 uppercase tracking-widest">
            PlantCareAI &bull; Engine v2.4.0
        </p>
    </div>
</div>
{% endblock %}
